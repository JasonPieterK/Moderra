notes: "Written both with diacritics and the plain ASCII spelling players type. The matcher strips diacritics (but not the letter đ), so the entries are chosen to avoid collisions with ordinary words: single words such as ngu (also ngủ 'sleep'), lồn (lon 'can'), điếm/điểm, đéo/đeo, vãi/vai and buổi/buồi were left out on purpose and only multi-word forms are kept. Risky entries are marked by being multi-word. Needs native review."
