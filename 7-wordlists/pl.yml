notes: "Diacritics are stripped by the matcher (chuj, kurwa, pierdolić fold to ASCII). Left out on purpose: zajebisty (positive slang), pedał (also pedal), murzyn, cholera is tier 1 only, burdel kept in tier 2. 'suka' is shared with the Russian and Ukrainian transliteration lists. 'dupa' is mild. False-positive review 2026-11-14: 'jeb' was removed (also the Minecraft developer name). 'suka' is also Indonesian 'to like'; the bundled default whitelist lets new installs write it. collisions-ok: ru uk cs hu ro Words shared with unrelated languages are cognates or borrowings with the same meaning. collisions-ok: debil dupa duren idiota pizda pojeb pojebany suka zasrany"
