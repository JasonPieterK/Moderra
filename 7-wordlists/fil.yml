notes: "Taglish chat spellings. Left out on purpose: leche (also Spanish 'milk'), puke (English), tae (Korean names such as Tae), bogo (also a city), atay, bakla (a neutral word, only a slur by tone), hayop alone (animal). 'puta' and 'putang ina' share roots with Spanish. 'babo' is not used. The list is short because many Filipino insults are mild phrases. Extended 2026-11-14 with common Taglish insults, Cebuano swear words and chat spellings (still unreviewed). 'inutil' is also a Spanish insult. collisions-ok: es pt-br Words shared with unrelated languages are cognates or borrowings with the same meaning. collisions-ok: bobo puta"
