# AntiBadWords word list. Format: see 7-wordlists/README.md. Offensive words are moderation data.
language: "fil"
name: Filipino (Tagalog and some Cebuano)
script: latin
review-status: unreviewed
sources:
  - "AI-written from general knowledge, no third-party list copied, unreviewed"
