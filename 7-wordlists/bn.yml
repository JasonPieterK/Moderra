notes: "Bengali script plus Roman spellings. Overlaps with the Hinglish and Roman Urdu spellings (gadha, harami, kutta, gandu). Left out on purpose: ছাগল (goat), পাগল (crazy), ফালতু (mild), বাল romanised (also 'ball'), pod (English word). Needs native review. Related languages share cognate words on purpose. Extended 2026-11-14 with common Bengali-script and Roman spellings. Removed: 'boka' (the Norwegian word for 'the book'). Left out: শালা (brother-in-law, also a mild swear). collisions-ok: hi ur"
