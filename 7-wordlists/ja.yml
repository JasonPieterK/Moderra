notes: "Kana and kanji plus romaji. Kana words are matched as substrings, so short entries can appear inside normal words; 2-character kana entries were chosen carefully. Left out: romaji 'shine' (English word) and 'baka' variants that are mild in anime talk are kept in tier 1 only. Also left out: ゴミ, ボケ, 変 (too common). 'baka' and 'aho' are mild. 'hentai' is tier 2 although it is also an English word. False-positive review 2026-11-14: hiragana ばか was removed because it sits inside ばかり (only, just) and ぐず inside ぐずぐず; くそ was removed because it sits inside ふくそう. Katakana バカ and 馬鹿 stay. Known risk: kana entries are also found across a comma ('さあ、ほら' contains あほ) because punctuation is dropped before matching."
