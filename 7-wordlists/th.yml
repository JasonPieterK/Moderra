# AntiBadWords word list. Format: see 7-wordlists/README.md. Offensive words are moderation data.
language: "th"
name: Thai
script: thai
review-status: unreviewed
sources:
  - "AI-written from general knowledge, no third-party list copied, unreviewed"
  - "LDNOOBW (CC BY 4.0, https://github.com/LDNOOBW/List-of-Dirty-Naughty-Obscene-and-Otherwise-Bad-Words) licence verified 2026-11-12; list downloaded for reference only, no entries copied"
notes: "Thai has no spaces between words, so entries are matched as substrings and short words can hide inside harmless words. Because of this these common short words were left out on purpose: หี (inside หีบ 'box'), สัด (inside สัดส่วน 'proportion'), ห่า (inside ห่าง 'far'), ชั่ว (inside ชั่วโมง 'hour'), เลว, บ้า. Insults with the prefix ไอ้ or อี are kept in full. Romanised spellings are included. sat (English word) was left out. Needs native review."
