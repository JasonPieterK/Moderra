notes: "Thai has no spaces between words, so entries are matched as substrings and short words can hide inside harmless words. Because of this these common short words were left out on purpose: หี (inside หีบ 'box'), สัด (inside สัดส่วน 'proportion'), ห่า (inside ห่าง 'far'), ชั่ว (inside ชั่วโมง 'hour'), เลว, บ้า. Insults with the prefix ไอ้ or อี are kept in full. Romanised spellings are included. sat (English word) was left out. Needs native review. False-positive review 2026-11-14: accents and tone marks are removed before matching, so a Thai word is compared without its tone marks and vowel signs. Removed for that reason: ร่าน and อีร่าน (inside ร้าน, shop, as in ชื่อร้าน), เหี้ย alone (inside เหยียบ), แม่ง alone (inside แมงมุม spider and แม่งาน), กะหรี่ alone (curry), อีหี (inside ซื้อหนังสือ), ควาย alone (buffalo). Only longer forms of these stay."
