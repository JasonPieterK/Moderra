# AntiBadWords word list. Format: see 7-wordlists/README.md. Offensive words are moderation data.
language: "pt-br"
name: Portuguese (Brazil)
script: latin
review-status: unreviewed
sources:
  - "AI-written from general knowledge, no third-party list copied, unreviewed"
  - "Legacy word-lists section of AntiBadWords 1.x config.yml (project's own list, all rights reserved), kept as a superset"
  - "LDNOOBW (CC BY 4.0, https://github.com/LDNOOBW/List-of-Dirty-Naughty-Obscene-and-Otherwise-Bad-Words) licence verified 2026-11-12; list downloaded for reference only, no entries copied"
notes: "Brazilian chat spellings (fdp, pqp, vsf) included. Legacy words kept: foda is also a common slang word for 'great' (risky), burro means donkey (also Spanish), noob is shared with English and Russian. Left out: cu (too short), pau, rola (too many innocent meanings). Spelling differences from pt-pt: filha da puta, vai se foder, caralho are shared on purpose. False-positive review 2026-11-14: legacy 'lixo' (garbage) and 'burro' (donkey) stay; the bundled default whitelist lets new installs write them. 'anta' (tapir) is kept as a mild insult. collisions-ok: es pt-pt en ru burro noob Words shared with unrelated languages are cognates or borrowings with the same meaning. collisions-ok: estupido fdp idiota imbecil lerdo merda mongoloide noob puta putona Related languages share cognate words on purpose. collisions-ok: pt-pt"
