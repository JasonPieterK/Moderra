  - "LDNOOBW (CC BY 4.0, https://github.com/LDNOOBW/List-of-Dirty-Naughty-Obscene-and-Otherwise-Bad-Words) licence verified 2026-11-12; list downloaded for reference only, no entries copied"
notes: "Covers Spain and Latin America. Accents are stripped by the matcher, so coño also matches the harmless word cono (cone) and joder/jodete are fine. Left out on purpose: concha (shell), perra (dog), burro (donkey, used in the pt-br legacy list), payaso (clown), puto is kept but note it is a normal word for 'boy' in Portugal (pt-pt omits it). Words shared with Portuguese (puta, merda is not shared) are intentional. False-positive review 2026-11-14: 'joto' was removed (it is the Swahili word for 'heat'). 'burro' (donkey) is a legacy entry; the bundled default whitelist lets new installs write it. 'pica' (it stings) is an everyday Spanish word, so the Czech and Portuguese entries that fold to it were removed from their lists. collisions-ok: pt-br pt-pt fil it Words shared with unrelated languages are cognates or borrowings with the same meaning. collisions-ok: bobo cagada cagar cretina cretino estupida estupido idiota imbecil lerdo maricas puta putas putona travelo"
