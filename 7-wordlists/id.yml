notes: "Chat spellings (kntl, mmk, gblk) are included on purpose. Risky: 'asu' and 'tai' are also words in other languages; 'cuk' is mild in Surabaya slang; 'babi' (pig) and 'monyet' (monkey) are insults but also real animals in Minecraft talk. Left out: suka, loh, gila, sampah (too common). collisions-ok: ms Related languages share cognate words on purpose. collisions-ok: ms"
