notes: "Traditional forms, Taiwanese Hokkien and Hong Kong Cantonese slang. Overlaps with zh where the characters are identical. Han words are matched as substrings, so short entries are risky. Romanisation uses jyutping-style and plain pinyin spellings that players type. Left out: 三小 variants that are also ordinary phrases. The whitelist applies to Han text (a whitelist entry containing the hit suppresses it; new installs ship 你媽媽, 他媽媽, 媽媽的, 三小時, 低能耗, 豬頭肉, 廢物利用, 我操作, 我日記, 去死亡). Restored after that change: 媽的, 他媽, 你媽, 豬頭, 低能, 去死. Still left out (too many harmless compounds such as 三小隊, 這些廢物可以回收): 三小, 廢物 alone. Earlier false-positive review 2026-11-14: removed 媽的, 他媽, 你媽, 三小 (inside 三小時, three hours), 豬頭, 低能 (inside 低能耗), 去死 and 廢物 alone; only longer forms stay. collisions-ok: zh Related languages share cognate words on purpose. collisions-ok: zh"
