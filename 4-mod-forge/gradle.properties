# Defaults = newest release. build-all-versions.sh overrides these per Minecraft version with -P flags.
minecraft_version=26.3
forge_version=66.1.5
forge_major=66
# only 1.21.11 still needs a mappings line; leave empty for 26.x (unobfuscated)
mappings_version=
java_release=25
# how the sign packet exposes its lines: "record" (26.3+) or "array" (older)
sign_api=record
# AbstractContainerMenu.clicked third parameter: "input" (ContainerInput, 26.3+) or "click" (ClickType, older)
menu_api=input
# ModList.isLoaded: "static" (26.x) or "instance" (1.21.11, ModList.get().isLoaded)
modlist_api=static
mod_version=2
# The version shown in mods.toml. mod_version stays the jar name number.
display_version=2.1
org.gradle.jvmargs=-Xmx3G
net.minecraftforge.gradle.merge-source-sets=true
