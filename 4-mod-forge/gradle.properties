# Defaults = newest release. build-all-versions.sh overrides these per Minecraft version with -P flags.
minecraft_version=26.3
forge_version=66.1.5
forge_major=66
# only 1.21.11 still needs a mappings line; leave empty for 26.x (unobfuscated)
mappings_version=
java_release=25
# how the sign packet exposes its lines: "record" (26.3+) or "array" (older)
sign_api=record
mod_version=1
org.gradle.jvmargs=-Xmx3G
net.minecraftforge.gradle.merge-source-sets=true
