name: AntiBadWords
version: 1.00
main: com.jason.plugins.antibadwords.AntiBadWordsPlugin
api-version: '1.21'
authors:
  - Jason
description: Advanced anti-profanity plugin for chat, signs, books, commands, and more.
commands:
  antibadwords:
    description: AntiBadWords admin command.
    usage: /antibadwords <subcommand>
    aliases: [abw, antiwords]
permissions:
  antibadwords.admin:
    description: Access to AntiBadWords admin commands.
    default: op
