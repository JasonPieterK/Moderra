filters:
  enabled-word-lists:
    - english
    - indonesian
    - custom
  matching:
    collapse-repeated-letters: true
    repeated-letter-threshold: 3

messages:
  warning-player: "&eNot allowed: '&f{word}&e' in &f{source}&e. Warning &f{count}/{limit}&e. &7({remaining} before punishment)"
  warning-broadcast-format: "&8[&cAntiBadWords&8] &f{player}&7: {warning}"
  punishment-player: "&cWatch your language."
  notify-staff: true
  staff-notify-format: "&8[&cAntiBadWords&8] &7Blocked '&f{word}&7' from &f{player}&7 in &f{source}&7."
  broadcast-warning-to-server: true

punishment:
# How many violations before punishing the player
  violations-before-punish: 2
  effects:
  # format: "<effect>-<amplifier>-<duration>"
    blindness:
      enabled: false
      format: "blindness-0-3"
    slowness:
      enabled: false
      format: "slowness-2-3"
    weakness:
      enabled: false
      format: "weakness-1-3"
    nausea:
      enabled: false
      format: "nausea-0-5"
    mining_fatigue:
      enabled: false
      format: "mining_fatigue-1-6"
    glow:
      enabled: false
      format: "glowing-0-10"
  attributes:
  # format: "<attribute>-<amplifier>-<duration>"
    shrink_scale:
      enabled: false
      # Slightly shrink player model size.
      format: "generic.scale-0.75-8"
    tiny_scale:
      enabled: false
      # Make player very small for a short time.
      format: "generic.scale-0.50-6"
    reduce_speed:
      enabled: false
      # Lower movement speed heavily.
      format: "generic.movement_speed-0.05-8"
    very_slow_speed:
      enabled: false
      # Extreme slow movement.
      format: "generic.movement_speed-0.02-5"
    reduce_attack:
      enabled: false
      # Reduce melee attack damage output.
      format: "generic.attack_damage-1.0-8"
    low_max_health:
      enabled: false
      # Temporarily lower max HP (careful: can be lethal if current HP is high/low edge cases).
      format: "generic.max_health-8.0-10"
    lower_knockback_resist:
      enabled: false
      # Player is easier to knock back.
      format: "generic.knockback_resistance-0.0-8"
    short_reach:
      enabled: false
      # Reduce block interaction range.
      format: "player.block_interaction_range-2.0-8"
    shorter_entity_reach:
      enabled: false
      # Reduce hit/interact range on entities.
      format: "player.entity_interaction_range-2.0-8"
    reduce_jump_strength:
      enabled: false
      # Lower jump strength/power.
      format: "generic.jump_strength-0.21-8"

