filters:
  enabled-word-lists:
    - english
    - indonesian
    - portuguese_brazil
    - russian
    - uk_english
    - german
    - chinese
    - custom
  protection-level: 3 # 1=LOW, 2=MEDIUM, 3=HIGH
  matching:
    collapse-repeated-letters: true
    repeated-letter-threshold: 3

messages:
  warning-broadcast-format: "&C{PLAYER} SAID THE WORD &F{WORD}&C WHICH IS NOT ALLOWED."
  warning-player: "&EWATCH YOUR WORDS. YOU ARE PUNISHED IF YOU SAY &F{REMAINING}&E BADWORDS AGAIN."
  punishment-broadcast-format: "&C{PLAYER} SAID THE WORD &F{WORD}&C WHICH IS NOT ALLOWED. FOR THEIR ACTION THEY'LL BE PUNISHED WITH &F{PUNISHMENTS}&C."
  punishment-player: "&CFOR YOUR BADWORDS, YOU ARE PUNISHED WITH &F{PUNISHMENTS}&C."
  punishment-disabled-player: "&EYOUR MESSAGE WAS BLOCKED. PUNISHMENT IS CURRENTLY DISABLED."
  notify-staff: true
  staff-notify-format: "&8[&cAntiBadWords&8] &7Blocked '&f{word}&7' from &f{player}&7 in &f{source}&7."

punishment:
  enabled: true
# How many violations before punishing the player
  violations-before-punish: 2
  final-command:
    enabled: false
    # NOTE: Example command -> "lp user {player} permission settemp antibadwords.muted true 30s"
    command: ""
  effects:
  # structured format:
  # effect-name: minecraft:blindness
  # amplifier: 0
  # duration: 3 #seconds
    blindness:
      enabled: false
      effect-name: "minecraft:blindness"
      amplifier: 0
      duration: 3
    slowness:
      enabled: false
      effect-name: "minecraft:slowness"
      amplifier: 2
      duration: 3
    weakness:
      enabled: false
      effect-name: "minecraft:weakness"
      amplifier: 1
      duration: 3
    nausea:
      enabled: false
      effect-name: "minecraft:nausea"
      amplifier: 0
      duration: 5
    mining_fatigue:
      enabled: false
      effect-name: "minecraft:mining_fatigue"
      amplifier: 1
      duration: 6
    glow:
      enabled: false
      effect-name: "minecraft:glowing"
      amplifier: 0
      duration: 10
  attributes:
  # structured format:
  # attribute-name: minecraft:generic.max_health
  # value: 0.75
  # duration: 8 #seconds
    reduce_speed:
      enabled: false
      # Lower movement speed heavily.
      attribute-name: "minecraft:generic.movement_speed"
      value: 0.05
      duration: 8
    very_slow_speed:
      enabled: false
      # Extreme slow movement.
      attribute-name: "minecraft:generic.movement_speed"
      value: 0.02
      duration: 5
    reduce_attack:
      enabled: false
      # Reduce melee attack damage output.
      attribute-name: "minecraft:generic.attack_damage"
      value: 1.0
      duration: 8
    low_max_health:
      enabled: false
      # Temporarily lower max HP (careful: can be lethal if current HP is high/low edge cases).
      attribute-name: "minecraft:generic.max_health"
      value: 8.0
      duration: 10
    lower_knockback_resist:
      enabled: false
      # Player is easier to knock back.
      attribute-name: "minecraft:generic.knockback_resistance"
      value: 0.0
      duration: 8
    short_reach:
      enabled: false
      # Reduce armor points temporarily.
      attribute-name: "minecraft:generic.armor"
      value: 0.0
      duration: 8
    shorter_entity_reach:
      enabled: false
      # Reduce armor toughness temporarily.
      attribute-name: "minecraft:generic.armor_toughness"
      value: 0.0
      duration: 8
    reduce_jump_strength:
      enabled: false
      # Lower attack speed to make hits slower.
      attribute-name: "minecraft:generic.attack_speed"
      value: 1.0
      duration: 8

