# Builds all 24 jars (Bukkit, Purpur, Fabric, Forge x 6 Minecraft versions) on GitHub's runners and,
# when started with a release tag, publishes them as a GitHub Release.
#   Actions tab -> "Build jars and release" -> Run workflow (tag empty = build only, tag v2.0.0 = build + release)
name: Build jars and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v2.0.0). Empty = only build and upload the jars as a workflow artifact."
        required: false
        default: ""
      server_test:
        description: "Also start real Fabric/Forge servers with each jar (TEST=1, slow)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
    branches: ["claude/**"]   # work branches: only when the commit message contains [build]

permissions:
  contents: write

jobs:
  engine-tests:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Engine unit tests
        run: cd 5-shared-engine && mvn -B -q test
      - name: Word-list validator
        run: python3 7-wordlists/tools/validate.py

  build:
    needs: engine-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [2-plugin-bukkit-purpur, 3-mod-fabric, 4-mod-forge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: j8
        with: { distribution: temurin, java-version: "8" }
      - uses: actions/setup-java@v4
        id: j21
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-java@v4
        id: j25
        with: { distribution: temurin, java-version: "25", cache: maven }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.8.0" }
      - name: Build all Minecraft versions
        env:
          JAVA8_HOME: ${{ steps.j8.outputs.path }}
          JAVA21_HOME: ${{ steps.j21.outputs.path }}
          JAVA25_HOME: ${{ steps.j25.outputs.path }}
          GRADLE: gradle
          TEST: ${{ (github.event.inputs.server_test == 'true') && '1' || '' }}
        run: |
          rm -f 1-download-jars/*.jar
          ./${{ matrix.loader }}/build-all-versions.sh
          ls -l 1-download-jars
      - name: Print the end of every build log (the development container reads results from the job log)
        if: always()
        run: |
          for f in $(find . -path '*/build-logs/*.log'); do
            echo "=====LOG $f"
            grep -n -E 'error:|ERROR|FAILED|Exception' "$f" | head -60
            tail -40 "$f"
          done
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.loader }}
          path: "**/build-logs/**"
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.loader }}
          path: 1-download-jars/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: github.event.inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "jars-*", path: jars, merge-multiple: true }
      - name: Count jars
        run: ls -l jars && test "$(ls jars/*.jar | wc -l)" -eq 24
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="$TAG_INPUT"
          [ -z "$TAG" ] && TAG="$(printf '%s' "$MSG" | grep -o '\[release v[0-9A-Za-z.\-]*\]' | head -1 | sed 's/\[release //; s/\]//')"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "Release tag: $TAG"
          notes="$(awk '/^## /{n++} n==1' CHANGELOG.md | head -200)"
          gh release create "$TAG" jars/*.jar --target "$GITHUB_SHA" --title "AntiBadWords $TAG" --notes "$notes"
