name: AntiBadWords
version: '${project.version}'
main: com.jason.plugins.antibadwords.AntiBadWordsPlugin
api-version: '${mc.api.version}'
authors:
  - Jason
description: Advanced anti-profanity plugin for chat, signs, books, commands, and anvils.
commands:
  antibadwords:
    description: AntiBadWords admin command.
    usage: /antibadwords <subcommand>
    aliases: [abw, antiwords]
permissions:
  antibadwords.admin:
    description: Access to the AntiBadWords admin commands (reload, addword, removeword, check, ...).
    default: op
  antibadwords.gui:
    description: Open the settings menu (/abw or /abw gui). Changing settings there is as powerful as editing the config files.
    default: op
  antibadwords.notify:
    description: Receive a staff notification whenever a bad word is blocked.
    default: op
  antibadwords.bypass:
    description: Exempt from all AntiBadWords checks.
    default: false
  antibadwords.bypass.spam:
    description: Exempt from the spam and flood rules (filters/spam.yml).
    default: false
  antibadwords.bypass.links:
    description: Exempt from the link filter (filters/links.yml).
    default: false
  antibadwords.bypass.evasion:
    description: Exempt from the bypass-trick detection (filters/evasion.yml, part "detect").
    default: false
