plugins {
    id 'fabric-loom' version "${loom_version}"
}

// Jar name: Antibadwords-RELEASE[Fabric] - 1-<minecraft version>.jar
base { archivesName = "Antibadwords-RELEASE[Fabric] - ${mod_version}" }
version = minecraft_version

repositories {
    mavenCentral()
}

// Minecraft 26.x is unobfuscated, so there is no mappings line. (For 1.21.x add: mappings loom.officialMojangMappings())
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation 'org.yaml:snakeyaml:2.3'
    include 'org.yaml:snakeyaml:2.3'
}

// Shared code: the Bukkit-free classes of the plugin + the loader-independent core + the Minecraft layer.
sourceSets {
    main {
        java {
            srcDir '../../src/main/java'
            srcDir '../core/src/main/java'
            srcDir '../core/src/mc/java'
            exclude '**/AntiBadWordsPlugin.java', '**/AntiBadWordsListener.java', '**/AntiBadWordsCommand.java',
                    '**/PunishmentExecutor.java', '**/PunishmentParser.java'
        }
        resources.srcDir '../core/src/mc/resources'
    }
}

processResources {
    // The plugin's own config.yml, so the mod and the plugin read exactly the same file.
    from('../../src/main/resources') { include 'config.yml' }
    inputs.property 'version', mod_version
    inputs.property 'minecraft_version', minecraft_version
    filesMatching('fabric.mod.json') {
        expand version: mod_version, minecraft_version: minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
