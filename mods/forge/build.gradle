plugins {
    id 'java'
    // ForgeGradle: check https://docs.minecraftforge.net/ for the plugin id/version that matches your Forge build
    // (ForgeGradle 6 -> 'net.minecraftforge.gradle', newer Forge builds ship their own Gradle plugin).
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${mod_version}+${minecraft_version}"
base { archivesName = 'AntiBadWords-forge' }

repositories {
    mavenCentral()
}

minecraft {
    mappings channel: 'official', version: minecraft_version
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation 'com.google.code.gson:gson:2.11.0'
}

sourceSets {
    main {
        java {
            srcDir '../../src/main/java'
            srcDir '../core/src/main/java'
            srcDir '../core/src/mc/java'
            exclude '**/AntiBadWordsPlugin.java', '**/AntiBadWordsListener.java', '**/AntiBadWordsCommand.java',
                    '**/AntiBadWordsSettings.java', '**/PunishmentAction.java', '**/PunishmentExecutor.java',
                    '**/PunishmentParser.java'
        }
        resources.srcDir '../core/src/main/resources'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, minecraft_version: minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
jar { finalizedBy 'reobfJar' }
