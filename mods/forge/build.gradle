plugins {
    id 'java'
    // ForgeGradle: check https://docs.minecraftforge.net/ for the plugin id/version that matches your Forge build
    // (ForgeGradle 6 -> 'net.minecraftforge.gradle', newer Forge builds ship their own Gradle plugin).
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = minecraft_version
// Jar name: Antibadwords-RELEASE[Forge] - 1-<minecraft version>.jar
base { archivesName = "Antibadwords-RELEASE[Forge] - ${mod_version}" }

repositories {
    mavenCentral()
}

minecraft {
    mappings channel: 'official', version: minecraft_version
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation 'org.yaml:snakeyaml:2.3'
    jarJar(implementation('org.yaml:snakeyaml:[2.3,3)')) { jarJar.pin(it, '2.3') }
}

sourceSets {
    main {
        java {
            srcDir '../../src/main/java'
            srcDir '../core/src/main/java'
            srcDir '../core/src/mc/java'
            exclude '**/AntiBadWordsPlugin.java', '**/AntiBadWordsListener.java', '**/AntiBadWordsCommand.java',
                    '**/PunishmentExecutor.java', '**/PunishmentParser.java'
        }
        resources.srcDir '../core/src/mc/resources'
    }
}

processResources {
    // The plugin's own config.yml, so the mod and the plugin read exactly the same file.
    from('../../src/main/resources') { include 'config.yml' }
    inputs.property 'version', mod_version
    filesMatching('META-INF/mods.toml') {
        expand version: mod_version, minecraft_version: minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
jar { finalizedBy 'reobfJar' }
// Mixin config for the sign/book/anvil/command scanners (also declared in mods.toml).
