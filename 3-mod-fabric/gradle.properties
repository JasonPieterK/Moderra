# Defaults = newest release. build-all-versions.sh overrides these per Minecraft version with -P flags:
#   minecraft_version, fabric_version, remap (true only for obfuscated releases, i.e. 1.21.x), java_release
minecraft_version=26.3
fabric_version=0.165.2+26.3
loader_version=0.20.1
loom_version=1.19.4
remap=false
java_release=25
# how the sign packet exposes its lines: "record" (26.3+) or "array" (older)
sign_api=record
# AbstractContainerMenu.clicked third parameter: "input" (ContainerInput, 26.3+) or "click" (ClickType, older)
menu_api=input
# Fabric Text Placeholder API (eu.pb4:placeholder-api) as compile-only dependency: "api" (needs placeholder_api_version) or "none" (no hook compiled)
placeholders_api=api
placeholder_api_version=3.2.0+26.3
# The ONE version: jar name Moderra<minecraft>-<mod_version>-fabric.jar and the version shown in the mod file.
mod_version=1.0
org.gradle.jvmargs=-Xmx3G
